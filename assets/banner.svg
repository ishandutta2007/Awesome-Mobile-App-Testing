<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orb {
        animation: pulseOrb 6s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 25s linear infinite;
      }
      .test-pulse {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .floating-node {
        animation: floatNode 5s ease-in-out infinite alternate;
      }
      @keyframes pulseOrb {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(1.15) translate(20px, 10px); opacity: 0.55; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes ping {
        0% { r: 5px; opacity: 1; }
        70% { r: 14px; opacity: 0; }
        100% { r: 14px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Orbs (Background depth) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="glow-orb" opacity="0.25" />
  <circle cx="1060" cy="270" r="160" fill="#a855f7" filter="url(#glow)" class="glow-orb" opacity="0.3" style="animation-delay: -3s;" />
  <circle cx="920" cy="70" r="100" fill="#06b6d4" filter="url(#glow)" class="glow-orb" opacity="0.2" style="animation-delay: -1.5s;" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Dynamic Testing Circuit Wave Lines (Behind Title) -->
  <g opacity="0.4">
    <path class="wave-line" d="M -50,190 Q 250,90 550,200 T 1250,160" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="wave-line" d="M -50,220 Q 300,310 650,170 T 1250,230" fill="none" stroke="#818cf8" stroke-width="2" style="animation-duration: 20s;" />
  </g>

  <!-- Floating Device Automation Badges (Side Accents) -->
  <g class="floating-node" transform="translate(70, 75)">
    <rect width="130" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8" />
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#bae6fd">🤖 Android UI</text>
  </g>

  <g class="floating-node" transform="translate(1005, 80)" style="animation-delay: -2s;">
    <rect width="120" height="42" rx="21" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#818cf8" />
    <text x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">🍏 iOS XCUITest</text>
  </g>

  <g class="floating-node" transform="translate(60, 245)" style="animation-delay: -3.5s;">
    <rect width="145" height="42" rx="21" fill="url(#pillGrad3)" stroke="#34d399" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#34d399" />
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">☁️ Device Farms</text>
  </g>

  <g class="floating-node" transform="translate(995, 235)" style="animation-delay: -1.2s;">
    <rect width="135" height="42" rx="21" fill="url(#pillGrad4)" stroke="#f472b6" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#f472b6" />
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fbcfe8">⚡ Maestro / E2E</text>
  </g>

  <!-- Central Foreground Content (Guaranteed crisp and unobstructed) -->
  <!-- Top Tag -->
  <g transform="translate(485, 42)">
    <rect width="230" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <circle cx="16" cy="14" r="4" fill="#10b981" class="test-pulse" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Mobile App Testing
  </text>

  <!-- Subtitle -->
  <text x="600" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">
    Open-Source Frameworks • Cloud Device Farms • E2E Automation • CI/CD QA Tools
  </text>

  <!-- Feature Metric Chips (Foreground Center Bottom) -->
  <g transform="translate(300, 235)">
    <rect width="170" height="40" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="85" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">📱 iOS &amp; Android</text>
  </g>

  <g transform="translate(490, 235)">
    <rect width="220" height="40" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="110" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🚀 Appium • Maestro • Detox</text>
  </g>

  <g transform="translate(730, 235)">
    <rect width="170" height="40" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="85" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">🔬 Self-Hosted Labs</text>
  </g>

  <!-- Clean Bottom Accent Line -->
  <line x1="100" y1="315" x2="1100" y2="315" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
